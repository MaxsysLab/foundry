[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maxsys-foundry"
version = "0.1.0"
description = "Takes a brief and builds a working web app with a team of headless Claude workers, through build, typecheck and test gates, a verify step and a review. A lab project: read the safety notes before you run it."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Maxsys International Incorporated and Foundry contributors" }]
keywords = ["llm", "agent", "codegen", "autonomous", "web", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]

# Deliberately lean: five dependencies and no agent framework. The workers are Claude
# Code, driven through the Claude Agent SDK, with the `claude` command as a fallback.
dependencies = [
    "anthropic>=0.40.0",
    "claude-agent-sdk>=0.2.110",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
foundry = "foundry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/foundry/roles/*" = ["E501"]        # role system-prompts read better unwrapped
"src/foundry/planner.py" = ["E501"]     # the planning system-prompt, likewise
"src/foundry/discovery.py" = ["E501"]   # the analyst system-prompt, likewise
"src/foundry/archetypes.py" = ["E501"]  # the archetype directives/instructions, likewise
"src/foundry/review.py" = ["E501"]      # the reviewer system-prompt, likewise
"src/foundry/verify.py" = ["E501"]      # the verifier system-prompt, likewise
"src/foundry/constitution.py" = ["E501"]  # the constitution prose, likewise
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
